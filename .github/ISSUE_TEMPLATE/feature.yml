name: Website feature request
description: Suggest an idea for the gers.page website. Not for map data.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This repository is only for the gers.page website. Requests about the map data go to
        [Overture](https://github.com/OvertureMaps/data/issues/new/choose).

        Issues here are public.
  - type: checkboxes
    id: scope
    attributes:
      label: Website only
      options:
        - label: This is about the website, not the map data.
          required: true
  - type: input
    id: page
    attributes:
      label: Page
      description: The page the idea relates to, if any.
      placeholder: https://gers.page/id/...
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How would it help?
