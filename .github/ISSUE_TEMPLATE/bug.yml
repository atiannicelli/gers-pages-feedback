name: Website bug
description: Something on the gers.page website doesn't work or display properly. Not for map data.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This repository is only for the gers.page website. It doesn't take reports about the map data, such as wrong
        names, addresses, categories or shapes. Report those to
        [Overture](https://github.com/OvertureMaps/data/issues/new/choose).

        Issues here are public.
  - type: checkboxes
    id: scope
    attributes:
      label: Website only
      options:
        - label: This is about the website, not the map data.
          required: true
  - type: input
    id: page
    attributes:
      label: Page
      description: The page where you saw the problem.
      placeholder: https://gers.page/id/...
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: What you did, what you saw and what you expected instead.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox on macOS
